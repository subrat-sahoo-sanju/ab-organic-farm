; Application PHP server configuration (loaded via `php -c php.ini -S ...`).
; The PHP built-in server enforces these limits when it parses request bodies,
; BEFORE any application code runs, so defaulting to PHP's tiny 2M cap would
; silently reject large banner uploads. Raised to comfortably fit 4MB images.

upload_max_filesize = 50M
post_max_size = 64M