<svg xmlns="http://www.w3.org/2000/svg" width="640" height="80" viewBox="0 0 640 80" role="img" aria-label="AB Organic Farm">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6B64A"/>
      <stop offset="1" stop-color="#CF9726"/>
    </linearGradient>
  </defs>

  <!-- monogram disc -->
  <circle cx="40" cy="40" r="38" fill="#0E2A21"/>
  <circle cx="40" cy="40" r="38" fill="none" stroke="#CF9726" stroke-width="3"/>
  <text x="40" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="bold" font-style="italic" fill="#F6F9F4" dominant-baseline="middle">A</text>
  <text x="40" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="21" font-weight="bold" fill="#B9E3C7" dominant-baseline="middle" dy="16">B</text>

  <!-- text (white for dark footer) -->
  <text x="104" y="40" text-anchor="start" font-family="Georgia, serif" font-size="40" font-weight="bold" font-style="italic" fill="#FFFFFF" dominant-baseline="middle">AB</text>
  <text x="184" y="40" text-anchor="start" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#E6DFCE" dominant-baseline="middle">ORGANIC FARM</text>
  <rect x="104" y="62" width="300" height="3" rx="1.5" fill="url(#g2)"/>
</svg>